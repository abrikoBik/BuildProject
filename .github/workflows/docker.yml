name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Backend
      run: docker build backend/ --tag mp1_backend:$(date +%s)
    - name: Frontend
      run: docker build frontend/ --tag mp1_frontend:$(date +%s)
