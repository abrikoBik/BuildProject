upstream frontend {
    # prefer vite release
    server frontend:4173;
    server frontend:5173 backup;
}

upstream backend {
    server backend:3000;
}

server {
    listen 80;

    limit_except GET POST PATCH DELETE {
        deny all;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        # hot module reloading for vite dev
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /api {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }
}
