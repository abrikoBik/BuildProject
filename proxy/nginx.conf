upstream frontend {
    server frontend:5173;
}

upstream backend {
    server backend:3000;
}

server {
    listen 80;

    location / {
        proxy_set_header Host $host;
        proxy_pass http://frontend/;
        # hot module reloading
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /api {
        proxy_set_header Host $host;
        proxy_pass http://backend/;
    }
}
