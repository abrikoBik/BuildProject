services:
  db:
    image: postgres
    container_name: mp1_db
    env_file: .env
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      # TODO: tune these variables
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - db-volume:/var/lib/postgresql

  backend:
    image: golang
    container_name: mp1_backend
    ports:
      - 3000:3000
    env_file: .env
    build: backend
    command:
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node
    container_name: mp1_frontend
    ports:
      - 5173:5173

volumes:
  db-volume:
