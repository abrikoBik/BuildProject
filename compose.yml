services:
  db:
    image: postgres
    container_name: mp1_db
    env_file: .env
    restart: always
    ports:
      - 5432:5432
    networks:
      - backend
    volumes:
      - db-volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 1s
      retries: 3

  backend:
    image: golang
    container_name: mp1_backend
    env_file: .env
    restart: always
    build: backend
    networks:
      - backend
      - proxy
    volumes:
      - attachment-volume:/var/lib/attachments
    links:
      - db
    depends_on:
      - db

  frontend:
    image: node
    container_name: mp1_frontend
    restart: always
    build: frontend
    networks:
      - proxy
    links:
      - backend
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app

  proxy:
    image: caddy
    container_name: mp1_proxy
    restart: always
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    networks:
      - proxy
    volumes:
      - type: bind
        # source: ./proxy/nginx.conf
        # target: /etc/nginx/conf.d/default.conf
        source: ./proxy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
    depends_on:
      - backend
      - frontend

networks:
  backend:
  proxy:

volumes:
  db-volume:
  attachment-volume:
