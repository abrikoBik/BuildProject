services:
  db:
    image: postgres:alpine
    container_name: mp1_db
    env_file: .env
    ports:
      - 5432:5432
    networks:
      - backend
    volumes:
      - db-volume:/var/lib/postgresql

  backend:
    image: golang
    container_name: mp1_backend
    env_file: .env
    build: backend
    ports:
      - 3000:3000
    networks:
      - backend
      - frontend
    links:
      - db
    depends_on:
      - db

  frontend:
    image: node
    container_name: mp1_frontend
    build: frontend
    ports:
      - 5173:5173
    networks:
      - frontend
    links:
      - backend
    depends_on:
      - backend

networks:
  backend:
  frontend:

volumes:
  db-volume:
