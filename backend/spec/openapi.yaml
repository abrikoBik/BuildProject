openapi: 3.1.1
info:
  title: Веб-приложение система управления строительством
  version: 1.0.0
paths:
  /sessions:
    post:
      responses:
        '201':
          description: Сессия создана успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/session/response'
        '403':
          description: Неверный пароль
        '404':
          description: Пользователь не найден
        '500':
          description: Неизвестная ошибка
    delete:
      responses:
        '200':
          description: Сессия удалена успешно
        '401':
          description: Токен не найден
        '500':
          description: Неизвестная ошибка

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
    get:
      summary: Получение информации о пользователе
      responses:
        '200':
          description: Пользователь существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user/response'
        '404':
          description: Пользователь не найден
    patch:
      summary: Обновление информации о пользователе
      responses:
        '200':
          description: Информация о пользователе обновлена успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user/response'
        '400':
          description: Ошибка во входных данных
        '404':
          description: Пользователь не найден
        '500':
          description: Неизвестная ошибка
    post:
      summary: Регистрация пользователя
      responses:
        '201':
          description: Пользователь зарегистрирован успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/id'
        '400':
          description: Ошибка во входных данных
        '500':
         description: Неизвестная ошибка

  /users/{userID}/worker:
    parameters:
      - name: userID
        in: path
        required: true
    get:
      summary: Получение информации о рабочем
      responses:
        '200':
          description: Рабочий существует
        '404':
          description: Рабочий не найден
    post:
      summary: Регистрация рабочего
      responses:
        '201':
          description: Рабочий зарегистрирован успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/id'
        '400':
          description: Ошибка во входных данных
        '403':
          description: Неверный пароль
        '500':
         description: Неизвестная ошибка

components:
  schemas:
    $ref: './schemas/_index.yaml'
